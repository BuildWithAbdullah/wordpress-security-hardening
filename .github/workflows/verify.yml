name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']
    name: node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      # PHP is preinstalled on the runner image. The version is printed rather
      # than pinned, because the plugins target PHP 8.x generally and a surprise
      # there is worth seeing in the log.
      - name: Report the PHP version
        run: php -v

      # Named test files rather than a glob. node --test did not accept glob
      # patterns before Node 21, so a globbed script runs nothing on Node 20
      # while reporting success, which is the worst available outcome.
      - run: npm test

      - run: npm run verify

      - run: npm run check

      # Fails if a finding was added or reworded and the generated document
      # was not regenerated with it.
      - run: npm run docs -- --check

  no-dependencies:
    runs-on: ubuntu-latest
    name: installs with nothing
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      # The repository claims the plugins have no dependencies and the suite
      # needs nothing installed. Asserting it beats stating it: npm ci on a
      # repository with no lockfile and no dependencies should be a no-op, and
      # the suite has to run straight from a clean checkout.
      - name: Confirm there is nothing to install
        run: |
          if [ -f package-lock.json ]; then
            echo "A lockfile appeared, so something is being depended on."
            exit 1
          fi
          if [ -d node_modules ]; then
            echo "node_modules is committed."
            exit 1
          fi
          npm test
